kind: Route
apiVersion: route.openshift.io/v1
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: prom-keycloak-proxy
    deployment: {{ .Values.name }}
spec:
  host: '{{ .Values.route.host }}'
  to:
    kind: Service
    name: {{ .Values.name }}
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
